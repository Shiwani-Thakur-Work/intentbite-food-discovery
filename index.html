<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntentBite AI — Natural-Language Food Discovery | AI Feature Rebuild</title>
  <meta name="description" content="A focused AI feature rebuild replacing multi-step food app filters with an explainable, 100% compliant natural language discovery engine." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/src/styles/designSystem.css" />

<body>

  <!-- Main Application Body -->
  <main id="main-content">
    <div id="hero-mount"></div>
    <div id="chips-mount"></div>
    <div id="results-mount"></div>

    <div id="eval-modal-mount"></div>

  <!-- Case Study Footer -->
  <footer style="max-width: 1200px; margin: 4rem auto 2rem; padding: 2rem 1.5rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; color: var(--text-muted); font-size: 0.85rem;">
    <div>

      <span style="color: var(--accent-primary);">✓ 100% Hard Constraint Gating</span>

  <script type="module" src="/src/main.js"></script>
